<!--
  Veraz lee este archivo al crear una cuenta y lo manda con Resend.
  {{ .ConfirmationURL }} se sustituye por el enlace de confirmación.
  Asunto: Confirma tu correo en Veraz
-->
<!DOCTYPE html>
<html lang="es">
  <body style="margin:0;padding:0;background:#0a0a0a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0a0a0a;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;">
            <tr>
              <td style="font-family:Helvetica,Arial,sans-serif;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#8a8a8a;">
                Veraz
              </td>
            </tr>
            <tr>
              <td style="padding-top:28px;font-family:Helvetica,Arial,sans-serif;font-size:28px;line-height:1.2;letter-spacing:-0.03em;color:#f5f5f5;">
                Confirma tu correo
              </td>
            </tr>
            <tr>
              <td style="padding-top:16px;font-family:Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45;color:#c4c4c4;">
                Alguien creó una cuenta en Veraz con este correo. Abre el enlace para activarla y completar la ficha.
              </td>
            </tr>
            <tr>
              <td style="padding-top:28px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#f5f5f5;color:#0a0a0a;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1;text-decoration:none;padding:14px 18px;">
                  Confirmar correo
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding-top:28px;font-family:Helvetica,Arial,sans-serif;font-size:13px;line-height:1.45;color:#8a8a8a;">
                Si el botón no abre, copia esta dirección en el navegador:<br />
                <a href="{{ .ConfirmationURL }}" style="color:#c4c4c4;word-break:break-all;">{{ .ConfirmationURL }}</a>
              </td>
            </tr>
            <tr>
              <td style="padding-top:32px;font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:1.4;color:#525252;">
                Si no pediste esta cuenta, ignora el mensaje.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
